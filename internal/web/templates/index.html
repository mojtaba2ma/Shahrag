<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Shahrag — Nginx Panel</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='10' fill='%23131826'/%3E%3Cpath d='M6 20 C 11 9, 29 9, 34 20 C 29 31, 11 31, 6 20 Z' fill='none' stroke='%237c9eff' stroke-width='1.8'/%3E%3Cpath d='M4 20 L10 20 L13 13 L17 27 L20 20 L24 20 L27 16 L30 22 L36 20' fill='none' stroke='%237c9eff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Use relative paths so the SPA works under /<panel-path>/ when proxied through nginx -->
<link rel="stylesheet" href="static/css/app.css">
<base href="">
</head>
<body class="app-body">

<!-- Animated background -->
<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Login screen -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-brand" id="login-brand"></div>
    <h1 class="login-title" data-i18n="login.title">ورود به شاه‌رگ</h1>
    <p class="login-subtitle" data-i18n="app.tagline">پنل مدیریت Nginx</p>
    <form id="login-form">
      <div class="field field-icon">
        <span class="field-icon-svg" id="icon-user"></span>
        <input type="text" name="username" value="admin" autocomplete="username" data-i18n-ph="login.username" placeholder="نام کاربری">
      </div>
      <div class="field field-icon">
        <span class="field-icon-svg" id="icon-lock"></span>
        <input type="password" name="password" autocomplete="current-password" data-i18n-ph="login.password" placeholder="رمز عبور">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
        <span class="btn-icon" id="icon-login"></span>
        <span data-i18n="login.submit">ورود</span>
      </button>
      <div class="form-error" id="login-error"></div>
    </form>
    <div class="login-footer">Shahrag v1.0</div>
  </div>
</div>

<!-- Main app shell -->
<div id="app-shell" class="app-shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-slot" id="sidebar-brand"></span>
      <div class="brand-meta">
        <span class="brand-text">Shahrag</span>
        <span class="brand-tag">Nginx Panel</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="status-pill" id="nginx-pill">
        <span class="status-dot" id="nginx-status"></span>
        <span id="nginx-status-text">nginx</span>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Menu"></button>
      <div class="topbar-left">
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-sub" id="page-subtitle"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="btn-generate">
          <span class="btn-icon" id="icon-generate"></span>
          <span class="btn-label" id="gen-label"></span>
        </button>
        <div class="select-wrap">
          <span class="select-icon" id="icon-globe"></span>
          <select id="lang-select" class="select-sm" title="Language"></select>
        </div>
        <div class="select-wrap">
          <span class="select-icon" id="icon-palette"></span>
          <select id="theme-select" class="select-sm" title="Theme"></select>
        </div>
        <button class="icon-btn" id="btn-logout" title="Logout"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<script>window.SHAHRAG_VERSION = "1.0.0";</script>
<script src="static/js/icons.js"></script>
<script src="static/js/i18n/fa.js"></script>
<script src="static/js/i18n/en.js"></script>
<script src="static/js/i18n/ar.js"></script>
<script src="static/js/i18n/tr.js"></script>
<script src="static/js/i18n/zh.js"></script>
<script src="static/js/i18n/ja.js"></script>
<script src="static/js/i18n/ko.js"></script>
<script src="static/js/i18n/pt.js"></script>
<script src="static/js/i18n/es.js"></script>
<script src="static/js/i18n/ru.js"></script>
<script src="static/js/app.js"></script>
<script>
  // Compute the panel's base path from the current URL so that relative
  // asset paths (static/...) work both at http://ip:8080/ and at
  // https://domain/<panel-path>/.
  (function () {
    var p = window.location.pathname;
    // If the path looks like /xxx/ or /xxx, the prefix is "/xxx/".
    var m = p.match(/^(\/[^/]+)\/?$/);
    if (m) {
      document.querySelector("base").href = m[1] + "/";
    }
  })();
</script>
</body>
</html>
